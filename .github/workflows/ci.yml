name: CI

on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        # 라이브 API 스모크는 기본 skip. 네트워크 의존을 CI 에 넣지 않음.
        # 필요 시 RUN_LIVE=1 로 로컬/수동 실행.
